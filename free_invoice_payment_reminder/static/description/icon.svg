<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Invoice payment reminder icon">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- background rounded card -->
  <rect x="32" y="48" rx="28" ry="28" width="344" height="416" fill="url(#g1)" stroke="#e6eefc" stroke-width="2" filter="url(#shadow)"/>

  <!-- folded corner -->
  <path d="M340 48 L340 128 L420 128 Z" fill="#e6eefc" opacity="0.9"/>

  <!-- invoice header bar -->
  <rect x="56" y="88" width="288" height="36" rx="6" fill="#007bff" />

  <!-- lines representing text -->
  <g fill="#2d3a4a" opacity="0.9">
    <rect x="68" y="148" rx="4" ry="4" width="220" height="12"/>
    <rect x="68" y="172" rx="4" ry="4" width="180" height="12"/>
    <rect x="68" y="196" rx="4" ry="4" width="240" height="12"/>
    <rect x="68" y="230" rx="4" ry="4" width="140" height="12"/>
    <rect x="68" y="254" rx="4" ry="4" width="200" height="12"/>
  </g>

  <!-- amount box -->
  <rect x="68" y="290" rx="8" ry="8" width="208" height="64" fill="#fff" stroke="#e0e7ff" stroke-width="2"/>
  <text x="84" y="324" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#0b64d6" font-weight="700">
    ₦ {{amount}}
  </text>
  <text x="84" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">Amount Due</text>

  <!-- small page lines at left bottom -->
  <g fill="#cbd5e1" opacity="0.95">
    <rect x="268" y="148" rx="3" ry="3" width="60" height="10"/>
    <rect x="268" y="166" rx="3" ry="3" width="40" height="10"/>
    <rect x="268" y="184" rx="3" ry="3" width="70" height="10"/>
  </g>

  <!-- reminder badge (circle with exclamation) -->
  <g transform="translate(392,72)">
    <circle cx="0" cy="0" r="64" fill="#d32f2f" stroke="#b71c1c" stroke-width="4"/>
    <rect x="-6" y="-28" width="12" height="36" rx="6" fill="#fff"/>
    <circle cx="0" cy="32" r="8" fill="#fff"/>
  </g>

  <!-- subtle outline for whole svg -->
  <rect x="28" y="44" rx="32" ry="32" width="360" height="424" fill="none" stroke-opacity="0.03"/>
</svg>
